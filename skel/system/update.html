<@7>
<@local(s,err,t)>
<$err=FormError>

<!--=========================================================================-->
<@> システムモード
<$v.system_mode("アップデート処理設定")>

<@> 階層ツリー、権限チェック、エラー表示
<@call("_sub/menu_tree")>

<!--=========================================================================-->
<article class="system setting">
<h2><@v.title></h2>
<div class="body">
	<form action="<@v.myself>?<@v.skeleton>" method="POST">
	<@ifexec(v.blog, begin)>
	<p><button type="submit" name="action" value="<@v.skel_dir>rebuild_blog_info">付加情報の再生成</button><span class="help" data-help="アクセスURLが変わった時に必ず実行してください。">?</span></p>

	<p><button type="submit" name="action" value="<@v.skel_dir>rebuild_blog">ブログの再構築</button><span class="help" data-help="すべての記事を再構築します。">?</span></p>

	<p><button type="submit" name="action" value="<@v.skel_dir>reinstall_plugins">プラグイン再インストール</button><span class="help" data-help="プラグインを更新したときに必要です。">?</span></p>

	<p><button type="submit" name="action" value="<@v.skel_dir>remake_custom_css">カスタムCSS再生成</button><span class="help" data-help="使用中のテーマカスタマイズ用CSSを再構築します。">?</span></p>
	<$end>

	<button type="submit" name="action" value="<@v.skel_dir>update" value="1"<@if(!v.require_update, ' disabled')>>アップデート処理を行う</button><span class="help" data-help="必要な時だけボタンがonになります">?</span>
	</form>
</div>
</article>
